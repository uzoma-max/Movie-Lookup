<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Max-i-movie Lookup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="hero-inner">
      <h1>Max-i-movie Lookup</h1>
      <p class="tagline">Search any film or series to see its poster, rating and plot.</p>

      <form id="search-form" role="search">
        <input id="query" type="search" placeholder="e.g. Inception" autocomplete="off" required>
        <button type="submit">Search</button>
      </form>
    </div>
  </header>

  <main>
    <p id="message" aria-live="polite"></p>

    <section id="home">
      <div class="row">
        <h2>Popular movies</h2>
        <div class="results" id="popular"></div>
      </div>
      <div class="row">
        <h2>Animation favourites</h2>
        <div class="results" id="animated"></div>
      </div>
    </section>

    <section id="results" class="results"></section>

    <section id="details" class="details" hidden></section>
  </main>

  <footer>
    Movie data from <a href="https://www.omdbapi.com/" target="_blank" rel="noopener">OMDb</a>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
